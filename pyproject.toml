[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Antonio_AHD3RA1"
version = "0.1.0"
description = "Calculos y validaciones"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    {name = "Antonio Milian", email = "antoniomg199565@gmail.com"}
]
license = { text = "MIT" }
keywords = ["ejemplo", "tutorial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "requests>=2.28",
    "numpy"
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/AntonioDV-web"
Repository = "https://github.com/AntonioDV-web/Antonio_AHD3RA1.git"

[tool.setuptools.packages.find]
where = ["src"]